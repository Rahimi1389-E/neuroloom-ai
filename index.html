<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuroloom AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Hintergrund aus Weiß, Blau, Dunkelblau und Rot */
            background: radial-gradient(circle at top left, #ffffff, #1e3c72, #0f172a),
                        radial-gradient(circle at bottom right, #dc2626, #0f172a);
            background-blend-mode: screen;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 80vh;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        /* Header mit Logo */
        .chat-header {
            padding: 16px 20px;
            background: rgba(30, 41, 59, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* NML Logo (Blau & Rot) */
        .logo-nml {
            background: linear-gradient(135deg, #2563eb, #dc2626);
            color: white;
            font-weight: 800;
            font-size: 16px;
            padding: 6px 12px;
            border-radius: 8px;
            letter-spacing: 1px;
            box-shadow: 0 2px 8px rgba(220, 38, 38, 0.3);
        }

        .chat-title {
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
        }

        /* Nachrichtenbereich */
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.bot {
            background: #1e293b;
            color: #f1f5f9;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .message.user {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message.error {
            background: rgba(220, 38, 38, 0.2);
            border: 1px solid #dc2626;
            color: #fca5a5;
            align-self: flex-start;
        }

        /* Eingabebereich */
        .chat-input-area {
            padding: 16px;
            background: rgba(30, 41, 59, 0.9);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        .chat-input:focus {
            border-color: #2563eb;
        }

        .send-btn {
            background: linear-gradient(135deg, #2563eb, #dc2626);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .send-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="logo-nml">NML</div>
            <div class="chat-title">Neuroloom AI</div>
        </div>

        <!-- Nachrichten -->
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                Hallo! Ich bin Neuroloom. Wie kann ich dir heute helfen?
            </div>
        </div>

        <!-- Eingabe -->
        <div class="chat-input-area">
            <input type="text" id="userInput" class="chat-input" placeholder="Schreibe eine Nachricht..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">Senden</button>
        </div>
    </div>

    <script>
        // TRAGE HIER DEINEN API-SCHLÜSSEL EIN
        const API_KEY = "AQ.Ab8RN6KVBBJo9pLKWZhvA-oC9k7m305zO2Vsczvlsq3FWy8zLA";

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const messageText = inputField.value.trim();
            if (!messageText) return;

            const chatMessages = document.getElementById('chatMessages');

            // Nachricht des Nutzers anzeigen
            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user';
            userMsgDiv.textContent = messageText;
            chatMessages.appendChild(userMsgDiv);

            inputField.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: messageText }] }]
                    })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const botMsgDiv = document.createElement('div');
                    botMsgDiv.className = 'message bot';
                    botMsgDiv.textContent = data.candidates[0].content.parts[0].text;
                    chatMessages.appendChild(botMsgDiv);
                } else {
                    showError("Antwort konnte nicht geladen werden.");
                }
            } catch (error) {
                showError("Entschuldigung, es gab einen Fehler bei der Verbindung.");
            }

            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showError(text) {
            const chatMessages = document.getElementById('chatMessages');
            const errorMsgDiv = document.createElement('div');
            errorMsgDiv.className = 'message error';
            errorMsgDiv.textContent = text;
            chatMessages.appendChild(errorMsgDiv);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
