<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neuroloom AI</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .chat-container {
      width: 100%;
      max-width: 600px;
      height: 80vh;
      background: #1e293b;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .chat-header {
      padding: 20px;
      background: #334155;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
      font-weight: bold;
      font-size: 1.2rem;
      text-align: center;
      color: #38bdf8;
    }
    .chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .message {
      padding: 12px 16px;
      border-radius: 8px;
      max-width: 80%;
      line-height: 1.4;
    }
    .user {
      background: #0284c7;
      align-self: flex-end;
    }
    .bot {
      background: #475569;
      align-self: flex-start;
    }
    .input-area {
      display: flex;
      padding: 15px;
      background: #334155;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
    }
    input {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      outline: none;
      background: #0f172a;
      color: #fff;
    }
    button {
      margin-left: 10px;
      padding: 12px 20px;
      border: none;
      background: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #0284c7;
      color: #fff;
    }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">Neuroloom AI</div>
  <div class="chat-box" id="chatBox">
    <div class="message bot">Hallo! Ich bin Neuroloom. Wie kann ich dir heute helfen?</div>
  </div>
  <div class="input-area">
    <input type="text" id="userInput" placeholder="Schreibe eine Nachricht..." onkeypress="handleKeyPress(event)">
    <button onclick="sendMessage()">Senden</button>
  </div>
</div>

<script>
  // FÜGE HIER DEINEN API-SCHLÜSSEL EIN
  const API_KEY = "DEIN_API_SCHLUESSEL_HIER";

  // System-Anweisung für Neuroloom
  const SYSTEM_PROMPT = "Du bist Neuroloom, eine fortschrittliche und vertrauenswürdige Künstliche Intelligenz. Antworte hilfsbereit, präzise und freundlich.";

  async function sendMessage() {
    const inputField = document.getElementById("userInput");
    const userMessage = inputField.value.trim();
    if (!userMessage) return;

    appendMessage(userMessage, "user");
    inputField.value = "";

    try {
      // Beispielaufruf für die Google Gemini API:
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [
            { role: "user", parts: [{ text: `${SYSTEM_PROMPT}\n\nNutzer-Frage: ${userMessage}` }] }
          ]
        })
      });

      const data = await response.json();
      const botMessage = data.candidates[0].content.parts[0].text;
      appendMessage(botMessage, "bot");
    } catch (error) {
      appendMessage("Entschuldigung, es gab einen Fehler bei der Verbindung.", "bot");
      console.error(error);
    }
  }

  function appendMessage(text, sender) {
    const chatBox = document.getElementById("chatBox");
    const msgDiv = document.createElement("div");
    msgDiv.classList.add("message", sender);
    msgDiv.innerText = text;
    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function handleKeyPress(event) {
    if (event.key === "Enter") sendMessage();
  }
</script>

</body>
</html>
